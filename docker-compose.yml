version: '3.8'

services:

  # ----------------------------
  # MINIO (DATA LAKE)
  # ----------------------------
  minio:
    image: minio/minio
    container_name: minio
    networks:
      - airflow-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ----------------------------
  # POSTGRES (DATA WAREHOUSE)
  # ----------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    networks:
      - airflow-net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: health_dw
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ----------------------------
  # AIRFLOW INIT
  # ----------------------------
  airflow-init:
    build: .
    container_name: airflow-init
    networks:
      - airflow-net
    depends_on:
      - postgres
      - minio
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres/health_dw
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "26c605d3e6f8c459177683b617120dc0645015878b78d16e091bcb38c13005a9"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    entrypoint: /bin/bash
    command: >
      -c "sleep 15 &&
      airflow db migrate &&
      airflow db upgrade &&
      airflow users create
      --username admin
      --password admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com"

  # ----------------------------
  # AIRFLOW WEBSERVER
  # ----------------------------
  airflow-webserver:
    build: .
    container_name: airflow-webserver
    networks:
      - airflow-net
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres/health_dw
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "26c605d3e6f8c459177683b617120dc0645015878b78d16e091bcb38c13005a9"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./data_lake:/opt/airflow/data_lake
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  # ----------------------------
  # AIRFLOW SCHEDULER
  # ----------------------------
  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    networks:
      - airflow-net
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres/health_dw
      AIRFLOW__WEBSERVER__SECRET_KEY: "26c605d3e6f8c459177683b617120dc0645015878b78d16e091bcb38c13005a9"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./data_lake:/opt/airflow/data_lake
    command: scheduler
    restart: always

# ----------------------------
# VOLUMES
# ----------------------------
volumes:
  postgres_data:
  minio_data:

# ----------------------------
# NETWORK
# ----------------------------
networks:
  airflow-net: