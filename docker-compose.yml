version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:6.2.1
    container_name: zookeeper
    networks:
      - airflow-net
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181


  # ----------------------------
  # KAFKA
  # ----------------------------
  kafka:
    image: confluentinc/cp-kafka:6.2.1
    container_name: kafka
    networks:
      - airflow-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  # ----------------------------
  # POSTGRES (DATA WAREHOUSE)
  # ----------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    networks:
      - airflow-net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: airflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------
  # MINIO (DATA LAKE)
  # ----------------------------
  minio:
    image: minio/minio
    container_name: minio
    networks:
      - airflow-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ----------------------------
  # AIRFLOW INIT
  # ----------------------------
  airflow-init:
    build: .
    container_name: airflow-init
    networks:
      - airflow-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW_CORE_EXECUTOR: SequentialExecutor
      AIRFLOW_DATABASE_SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres:5432/airflow_db
      AIRFLOW_CORE_LOAD_EXAMPLES: "false"
      AIRFLOW_WEBSERVER_SECRET_KEY: "26c605d3e6f8c459177683b617120dc0645015878b78d16e091bcb38c13005a9"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com
      "

  # ----------------------------
  # AIRFLOW WEBSERVER
  # ----------------------------
  airflow-webserver:
    build: .
    container_name: airflow-webserver
    networks:
      - airflow-net
    depends_on:
      - airflow-init
    environment:
      AIRFLOW_CORE_EXECUTOR: SequentialExecutor
      AIRFLOW_DATABASE_SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres:5432/airflow_db
      AIRFLOW_CORE_LOAD_EXAMPLES: "false"
      AIRFLOW_WEBSERVER_SECRET_KEY: "26c605d3e6f8c459177683b617120dc0645015878b78d16e091bcb38c13005a9"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./data_lake:/opt/airflow/data_lake
    ports:
      - "8082:8080"
    command: webserver
    restart: always



  metabase:
    image: metabase/metabase
    container_name: metabase
    ports:
      - "3000:3000"
    networks:
      - airflow-net
  # ----------------------------
  # AIRFLOW SCHEDULER
  # ----------------------------
  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    networks:
      - airflow-net
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW_CORE_EXECUTOR: SequentialExecutor
      AIRFLOW_DATABASE_SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres:5432/airflow_db
      AIRFLOW_WEBSERVER_SECRET_KEY: "26c605d3e6f8c459177683b617120dc0645015878b78d16e091bcb38c13005a9"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./data_lake:/opt/airflow/data_lake
    command: scheduler
    restart: always

# ----------------------------
# VOLUMES
# ----------------------------
volumes:
  postgres_data:
  minio_data:

# ----------------------------
# NETWORK
# ----------------------------
networks:
  airflow-net: