version: '3.8'

services:

  # ----------------------------
  # POSTGRES (DATA WAREHOUSE)
  # ----------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: health_dw
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  # ----------------------------
  # AIRFLOW INIT
  # ----------------------------
  airflow-init:
    image: apache/airflow:2.9.0
    container_name: airflow-init
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres/health_dw
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "fernet-key-1234567890abcdef"
    volumes:
      - ./dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command: -c "sleep 10 && airflow db init && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"


  # ----------------------------
  # AIRFLOW WEBSERVER
  # ----------------------------
  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres/health_dw
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "EY3_j7yoONPBn5ofJfS7-_RdwB-Wbt_jg1UL54Ep4TE="
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: webserver


  # ----------------------------
  # AIRFLOW SCHEDULER
  # ----------------------------
  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: airflow-scheduler
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:test@postgres/health_dw
      AIRFLOW__CORE__FERNET_KEY: "fernet-key-1234567890abcdef"
    volumes:
      - ./dags:/opt/airflow/dags
    command: scheduler


volumes:
  postgres_data: